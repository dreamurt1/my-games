<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안녕, 나는 라이언</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #2b1055;
      --ink-2: #3a1a72;
      --ink-3: #4b2a8a;
      --ink-deep: #1a0b3b;
      --orange: #f7924a;
      --orange-hi: #ffc58e;
      --orange-lo: #d8692e;
      --cream: #fff1e0;
      --lilac: #b9a6ff;
      --lilac-deep: #7c5cff;
      --text-soft: #d2c6f7;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      scrollbar-color: var(--ink-3) var(--ink-deep);
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif;
      font-weight: 500;
      background: var(--ink);
      color: var(--cream);
      word-break: keep-all;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--orange); color: var(--ink-deep); }

    :focus-visible {
      outline: 3px solid var(--lilac);
      outline-offset: 4px;
      border-radius: 12px;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding-inline: clamp(1rem, 4vw, 3rem);
    }

    /* ── 무대 (첫 화면) ───────────────────────── */
    .stage {
      min-height: min(100svh, 60rem);
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      align-items: center;
      gap: clamp(1rem, 3vw, 3rem);
      padding-block: 3rem;
    }

    h1 {
      font-size: clamp(3.2rem, 7.4vw, 6rem);
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    h1 .name, h2 .name { color: var(--orange); }

    .intro {
      margin-top: 1.5rem;
      max-width: 26ch;
      font-size: clamp(1.1rem, 1.6vw, 1.3rem);
      line-height: 1.6;
      color: var(--text-soft);
    }

    .pills {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1.75rem;
    }

    .pills li {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 1rem 0.55rem 0.8rem;
      border-radius: 999px;
      background: var(--ink-2);
      font-weight: 700;
      font-size: 0.98rem;
      box-shadow:
        inset 0 2px 1px rgba(255, 255, 255, 0.12),
        inset 0 -3px 3px rgba(0, 0, 0, 0.35),
        0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .pills svg { width: 1.3rem; height: 1.3rem; flex: none; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 1.5rem;
      margin-top: 2.5rem;
    }

    .btn-clay {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink-deep);
      padding: 1rem 2.1rem;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      background: radial-gradient(120% 150% at 30% 15%, var(--orange-hi) 0%, var(--orange) 45%, var(--orange-lo) 100%);
      box-shadow:
        inset 0 3px 2px rgba(255, 236, 214, 0.75),
        inset 0 -5px 4px rgba(150, 60, 15, 0.5),
        0 12px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s var(--ease-spring), box-shadow 0.2s, filter 0.2s;
    }

    .btn-clay:hover { transform: translateY(-3px); filter: brightness(1.05); }

    .btn-clay:active {
      transform: translateY(2px);
      box-shadow:
        inset 0 2px 2px rgba(255, 236, 214, 0.6),
        inset 0 -2px 3px rgba(150, 60, 15, 0.5),
        0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .hint { color: var(--text-soft); font-size: 0.98rem; }

    /* 고양이 무대 */
    .stage-art {
      position: relative;
      width: 100%;
      max-width: 640px;
      justify-self: center;
    }

    .stage-art::before {
      content: "";
      position: absolute;
      inset: -10% -15% 0;
      background: radial-gradient(ellipse 50% 48% at 50% 55%, rgba(124, 92, 255, 0.3), rgba(124, 92, 255, 0) 70%);
      pointer-events: none;
    }

    .diorama {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
      max-height: 78svh;
      overflow: visible;
    }

    .diorama *, .figure * { transform-box: view-box; }

    .float  { animation: float 5s ease-in-out infinite; }
    .breathe { transform-origin: 300px 515px; animation: breathe 3.2s ease-in-out infinite; }
    .tail   { transform-origin: 385px 468px; animation: tail 2.6s ease-in-out infinite; }
    .head   { transform-origin: 300px 390px; transition: transform 0.5s var(--ease-out); }
    .eyes   { transition: transform 0.35s var(--ease-out); }
    .eye    { transform-box: fill-box; transform-origin: center; transition: transform 0.08s; }
    .blink .eye { transform: scaleY(0.1); }
    .shadow { transform-origin: 300px 600px; animation: shadow 5s ease-in-out infinite; }

    @keyframes float   { 50% { transform: translateY(-10px); } }
    @keyframes shadow  { 50% { transform: scale(0.92); opacity: 0.7; } }
    @keyframes breathe { 50% { transform: scaleY(1.014); } }
    @keyframes tail    { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(7deg); } }

    .hop { animation: hop 0.55s var(--ease-spring); transform-origin: 300px 515px; }
    @keyframes hop {
      0%   { transform: translateY(0) scale(1, 1); }
      25%  { transform: translateY(0) scale(1.06, 0.92); }
      55%  { transform: translateY(-26px) scale(0.96, 1.05); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* 액세서리: 착용한 것만 보여요 */
    .acc { opacity: 0; transition: opacity 0.25s; pointer-events: none; }
    [data-equip="music"]  .acc-music,
    [data-equip="design"] .acc-design,
    [data-equip="run"]    .acc-run { opacity: 1; }
    [data-equip="design"] .paw-rest-right { opacity: 0; }

    .notes > g { transform-box: fill-box; animation: note 2.4s ease-in-out infinite; }
    .notes > g:nth-child(2) { animation-delay: -1.2s; }
    @keyframes note {
      0%   { transform: translateY(14px); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateY(-30px) rotate(10deg); opacity: 0; }
    }

    .speed line { stroke-dasharray: 60 60; animation: speed 0.9s linear infinite; }
    .speed line:nth-child(2) { animation-delay: -0.3s; }
    .speed line:nth-child(3) { animation-delay: -0.6s; }
    @keyframes speed { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }

    /* 인사: 왼쪽 앞발을 흔들어요 */
    .paw-wave { opacity: 0; transform-origin: 236px 432px; }
    .waving .paw-rest-left { opacity: 0; }
    .waving .paw-wave { opacity: 1; animation: wave 0.4s ease-in-out 4 alternate; }
    @keyframes wave { from { transform: rotate(14deg); } to { transform: rotate(-16deg); } }

    /* 무대 위 소품 */
    .prop { cursor: pointer; outline: none; }
    .prop .lift { transition: transform 0.35s var(--ease-spring), opacity 0.3s; }
    .prop:hover .lift,
    .prop:focus-visible .lift { transform: translateY(-10px); }
    .prop .ring { opacity: 0; transition: opacity 0.2s; }
    .prop:focus-visible .ring { opacity: 1; }
    .prop[aria-pressed="true"] .lift { opacity: 0.28; }

    /* 말풍선 */
    .bubble {
      position: absolute;
      top: 3%;
      left: 0;
      max-width: min(17rem, 48%);
      padding: 0.9rem 1.15rem;
      border-radius: 22px;
      background: var(--cream);
      color: var(--ink-deep);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35), inset 0 -3px 2px rgba(200, 160, 120, 0.35);
      line-height: 1.45;
      transform-origin: 85% 100%;
      z-index: 1;
    }

    .bubble::after {
      content: "";
      position: absolute;
      right: 18%;
      bottom: -12px;
      width: 26px;
      height: 26px;
      background: var(--cream);
      border-radius: 0 0 8px 0;
      transform: rotate(45deg) skew(8deg, 8deg);
    }

    .bubble strong {
      display: block;
      font-weight: 800;
      font-size: 1.05rem;
      color: #b8501c;
    }

    .bubble span { font-size: 0.98rem; }

    .bubble.pop { animation: pop 0.45s var(--ease-spring); }
    @keyframes pop { from { transform: scale(0.85); opacity: 0.4; } }

    /* ── 취미: 장난감 선반 ─────────────────── */
    .hobbies { padding-block: clamp(4rem, 9vw, 7rem); }

    h2 {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: clamp(1.5rem, 4vw, 3rem);
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .shelf-item {
      padding-inline: clamp(0.75rem, 2vw, 1.75rem);
      text-align: center;
    }

    .figure {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
      margin: 0 auto -10px;
      overflow: visible;
      position: relative;
      z-index: 1;
    }

    .plank {
      height: 26px;
      margin-inline: calc(-1 * clamp(0.75rem, 2vw, 1.75rem));
      background: linear-gradient(180deg, #6a44b4 0%, #563399 30%, #3a1d78 31%, #2a1260 100%);
      box-shadow: 0 16px 26px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.16);
    }

    .shelf-item:first-child .plank { border-radius: 10px 0 0 10px; }
    .shelf-item:last-child .plank  { border-radius: 0 10px 10px 0; }

    .shelf-item h3 {
      margin-top: 2rem;
      font-size: clamp(1.35rem, 2.2vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .shelf-item p {
      margin: 0.75rem auto 0;
      max-width: 26ch;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-soft);
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      padding: 0.25rem 0;
      font: inherit;
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--orange-hi);
      background: none;
      border: 0;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    .link-btn svg { width: 1.1rem; height: 1.1rem; transition: transform 0.25s var(--ease-out); }
    .link-btn:hover svg { transform: translateY(-3px); }

    /* ── 마무리 ────────────────────────────── */
    footer {
      padding-block: 3rem 4rem;
      text-align: center;
      border-top: 1px solid rgba(185, 166, 255, 0.18);
    }

    footer .paws { display: flex; justify-content: center; gap: 0.9rem; margin-bottom: 1rem; }
    footer .paws svg { width: 1.6rem; height: 1.6rem; }
    footer .paws svg:nth-child(even) { transform: translateY(-8px) rotate(12deg); }
    footer p { font-weight: 700; font-size: 1.2rem; }

    /* 반짝이 */
    .spark {
      position: fixed;
      width: 22px;
      height: 22px;
      pointer-events: none;
      z-index: 10;
      animation: spark 0.9s var(--ease-out) forwards;
    }

    @keyframes spark {
      to { transform: translate(var(--x), var(--y)) rotate(160deg) scale(0.2); opacity: 0; }
    }

    /* ── 좁은 화면 ─────────────────────────── */
    @media (max-width: 860px) {
      .stage {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-block: 2.5rem 1rem;
        gap: 1.5rem;
      }
      .stage-art { max-width: 520px; }
      .bubble {
        position: relative;
        top: auto;
        left: auto;
        max-width: 85%;
        width: fit-content;
        margin: 0 auto 0.25rem;
        text-align: center;
        transform-origin: 50% 100%;
      }
      .bubble::after { right: calc(50% - 13px); }
      .shelf { grid-template-columns: 1fr; gap: 3.5rem; }
      .shelf-item .figure { max-width: 300px; }
      .plank,
      .shelf-item:first-child .plank,
      .shelf-item:last-child .plank { margin-inline: 8%; border-radius: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .float, .shadow, .breathe, .tail, .notes > g, .speed line, .hop,
      .waving .paw-wave, .bubble.pop { animation: none; }
    }
  </style>
</head>
<body>

  <!-- 공용 재질: 하나의 조명(왼쪽 위)을 모든 부품이 같이 써요 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- 털: 고양이 전체가 같은 빛을 받아요 -->
      <radialGradient id="g-fur" gradientUnits="userSpaceOnUse" cx="225" cy="160" r="400">
        <stop offset="0" stop-color="#ffd6a8" />
        <stop offset="0.32" stop-color="#fca868" />
        <stop offset="0.58" stop-color="#f7924a" />
        <stop offset="0.82" stop-color="#d8692e" />
        <stop offset="1" stop-color="#b3501d" />
      </radialGradient>
      <radialGradient id="g-cream" cx="0.35" cy="0.3" r="0.8">
        <stop offset="0" stop-color="#fffaf3" />
        <stop offset="0.6" stop-color="#ffe9cf" />
        <stop offset="1" stop-color="#e8b88c" />
      </radialGradient>
      <radialGradient id="g-lilac" cx="0.35" cy="0.3" r="0.8">
        <stop offset="0" stop-color="#ebe4ff" />
        <stop offset="0.5" stop-color="#a68bff" />
        <stop offset="1" stop-color="#5a3ecc" />
      </radialGradient>
      <radialGradient id="g-ear" cx="0.45" cy="0.75" r="0.75">
        <stop offset="0" stop-color="#ffc6b6" />
        <stop offset="0.55" stop-color="#ff9a86" />
        <stop offset="1" stop-color="#c9604e" />
      </radialGradient>
      <radialGradient id="g-eye" cx="0.5" cy="0.7" r="0.65">
        <stop offset="0" stop-color="#4b2a8a" />
        <stop offset="0.55" stop-color="#22104d" />
        <stop offset="1" stop-color="#0d0324" />
      </radialGradient>
      <radialGradient id="g-stage-top" cx="0.5" cy="0.3" r="0.75">
        <stop offset="0" stop-color="#5c38a4" />
        <stop offset="0.6" stop-color="#432581" />
        <stop offset="1" stop-color="#33186a" />
      </radialGradient>
      <linearGradient id="g-stage-side" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#34196b" />
        <stop offset="1" stop-color="#1d0b44" />
      </linearGradient>

      <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" /></filter>
      <filter id="f-blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18" /></filter>
      <filter id="f-gloss" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>
      <filter id="f-tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" /></filter>
      <filter id="f-drop" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45" />
      </filter>

      <!-- 고양이 형태 (그림자·림라이트용으로 재사용) -->
      <ellipse id="s-head" cx="300" cy="270" rx="150" ry="125" />
      <ellipse id="s-body" cx="300" cy="440" rx="100" ry="76" />
      <path id="s-tail" d="M378 487 C466 496 510 420 469 347 A12 12 0 0 0 447 357 C474 416 444 460 382 453 Z" />

      <clipPath id="cp-head"><use href="#s-head" /></clipPath>
      <clipPath id="cp-body"><use href="#s-body" /></clipPath>
      <clipPath id="cp-tail"><use href="#s-tail" /></clipPath>
      <clipPath id="cp-eye-l"><ellipse cx="245" cy="282" rx="23" ry="29" /></clipPath>
      <clipPath id="cp-eye-r"><ellipse cx="355" cy="282" rx="23" ry="29" /></clipPath>

      <!-- 림라이트: 그림자 쪽 가장자리만 남기는 초승달 마스크 -->
      <mask id="m-rim-head" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="620">
        <use href="#s-head" fill="#fff" />
        <use href="#s-head" fill="#000" transform="translate(-11 -9)" filter="url(#f-tiny)" />
      </mask>
      <mask id="m-rim-body" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="620">
        <use href="#s-body" fill="#fff" />
        <use href="#s-body" fill="#000" transform="translate(-9 -8)" filter="url(#f-tiny)" />
      </mask>
      <mask id="m-rim-tail" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="620">
        <use href="#s-tail" fill="#fff" />
        <use href="#s-tail" fill="#000" transform="translate(-6 -5)" filter="url(#f-tiny)" />
      </mask>

      <!-- 헤드폰 -->
      <symbol id="p-music" viewBox="0 0 100 100">
        <path d="M19 62 Q19 16 50 16 Q81 16 81 62" fill="none" stroke="#4a32a8" stroke-width="11" stroke-linecap="round" transform="translate(1.5 2)" />
        <path d="M19 62 Q19 16 50 16 Q81 16 81 62" fill="none" stroke="url(#g-lilac)" stroke-width="9" stroke-linecap="round" />
        <path d="M22 48 Q25 21 46 18" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
        <rect x="11" y="55" width="24" height="36" rx="11" fill="#3f2a96" />
        <rect x="71" y="55" width="24" height="36" rx="11" fill="#3f2a96" />
        <rect x="8" y="52" width="24" height="36" rx="11" fill="url(#g-lilac)" />
        <rect x="68" y="52" width="24" height="36" rx="11" fill="url(#g-lilac)" />
        <rect x="25" y="58" width="8" height="24" rx="4" fill="#2b1055" />
        <rect x="67" y="58" width="8" height="24" rx="4" fill="#2b1055" />
        <ellipse cx="15" cy="61" rx="3.5" ry="6" fill="#fff" opacity="0.65" />
        <ellipse cx="75" cy="61" rx="3.5" ry="6" fill="#fff" opacity="0.65" />
      </symbol>

      <!-- 팔레트와 붓 -->
      <symbol id="p-design" viewBox="0 0 100 100">
        <path d="M14 55 C9 30 34 15 60 18 C85 22 95 45 85 62 C78 75 63 70 58 79 C53 89 30 89 20 76 C16 70 15 63 14 55 Z" fill="#b98a62" transform="translate(1.5 5)" />
        <path d="M14 55 C9 30 34 15 60 18 C85 22 95 45 85 62 C78 75 63 70 58 79 C53 89 30 89 20 76 C16 70 15 63 14 55 Z" fill="url(#g-cream)" />
        <circle cx="38" cy="71" r="6.5" fill="#2b1055" />
        <path d="M32 74 A6.5 6.5 0 0 0 44 74" fill="none" stroke="#b98a62" stroke-width="2" />
        <circle cx="34" cy="40" r="7.5" fill="#f7924a" />
        <circle cx="54" cy="31" r="7.5" fill="#a68bff" />
        <circle cx="72" cy="40" r="7" fill="#ff8f7a" />
        <circle cx="74" cy="57" r="6.5" fill="#7c5cff" />
        <circle cx="31.5" cy="37.5" r="2.2" fill="#fff" opacity="0.8" />
        <circle cx="51.5" cy="28.5" r="2.2" fill="#fff" opacity="0.8" />
        <circle cx="69.5" cy="37.5" r="2" fill="#fff" opacity="0.8" />
        <circle cx="72" cy="55" r="1.8" fill="#fff" opacity="0.8" />
        <ellipse cx="26" cy="50" rx="4" ry="9" fill="#fff" opacity="0.55" transform="rotate(15 26 50)" />
        <path d="M54 94 L84 26" stroke="#a87a50" stroke-width="7" stroke-linecap="round" transform="translate(1.5 1.5)" />
        <path d="M54 94 L84 26" stroke="#ffd8a8" stroke-width="6" stroke-linecap="round" />
        <path d="M84 26 L91 10" stroke="#5a3ecc" stroke-width="10" stroke-linecap="round" transform="translate(1 1)" />
        <path d="M84 26 L91 10" stroke="#8f74ff" stroke-width="9" stroke-linecap="round" />
        <path d="M85 21 L88 14" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      </symbol>

      <!-- 운동화 -->
      <symbol id="p-run" viewBox="0 0 100 100">
        <rect x="6" y="70" width="90" height="13" rx="6.5" fill="#c9966c" />
        <rect x="6" y="65" width="90" height="13" rx="6.5" fill="url(#g-cream)" />
        <path d="M10 64 C10 47 22 41 33 43 L47 30 C54 25 62 29 64 37 C70 48 87 51 92 62 L92 69 L10 69 Z" fill="#4a32a8" transform="translate(1.5 2)" />
        <path d="M10 64 C10 47 22 41 33 43 L47 30 C54 25 62 29 64 37 C70 48 87 51 92 62 L92 69 L10 69 Z" fill="url(#g-lilac)" />

  <script>
    // ✏️ 여기만 고치면 내 정보가 바뀌어요
    const ME = {
      name: "라이언",
      intro: "잔잔한 곡을 쓰고, 캐릭터를 그리고, 바람을 가르며 달리는 사람이에요.",
      birthday: "3월 15일생",
      sign: "물고기자리",
      hello: { title: "반가워요!", line: "와 줘서 고마워요." },
      idle: { title: "냐옹!", line: "무대 위 소품을 눌러 봐요." },
      hobbies: [
        {
          id: "music",
          title: "뉴에이지 · 배경음악 작곡",
          desc: "잔잔하고 따뜻한 선율을 만들어요. 조용히 곁에 머무는 소리를 좋아해요.",
          prop: "헤드폰",
          line: "헤드폰을 쓰면 잔잔한 선율이 떠올라요.",
        },
        {
          id: "design",
          title: "웹 · 캐릭터 디자인",
          desc: "화면과 캐릭터에 색과 표정을 입혀요. 웹 페이지도, 작은 캐릭터도 직접 그려요.",
          prop: "팔레트와 붓",
          line: "붓을 들면 색과 표정이 살아나요.",
        },
        {
          id: "run",
          title: "달리기 운동",
          desc: "바람을 가르며 달리면 기분이 상쾌해요.",
          prop: "운동화",
          line: "머리띠를 질끈! 바람을 가르며 달려요.",
        },
      ],
    };

    const diorama = document.getElementById("diorama");
    const cat = document.getElementById("cat");
    const head = cat.querySelector(".head");
    const eyes = document.getElementById("eyes");
    const bubble = document.getElementById("bubble");
    const props = [...document.querySelectorAll(".prop")];
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // 글자 채우기
    document.querySelectorAll("[data-me]").forEach((el) => {
      el.textContent = ME[el.dataset.me];
    });

    // 취미 선반: 같은 고양이가 취미마다 소품을 하고 앉아 있어요
    const SVG_NS = "http://www.w3.org/2000/svg";
    const hobbyList = document.getElementById("hobbyList");
    ME.hobbies.forEach((h) => {
      const item = document.createElement("article");
      item.className = "shelf-item";

      const fig = document.createElementNS(SVG_NS, "svg");
      fig.setAttribute("class", "figure");
      fig.setAttribute("viewBox", "40 70 520 462");
      fig.setAttribute("aria-hidden", "true");
      fig.dataset.equip = h.id;
      const clone = cat.cloneNode(true);
      clone.removeAttribute("id");
      clone.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
      fig.appendChild(clone);

      const plank = document.createElement("div");
      plank.className = "plank";

      const title = document.createElement("h3");
      title.textContent = h.title;
      const desc = document.createElement("p");
      desc.textContent = h.desc;

      const btn = document.createElement("button");
      btn.className = "link-btn";
      btn.type = "button";
      btn.innerHTML = `고양이에게 건네기
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16 V4 M5 9 L10 4 L15 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
      btn.addEventListener("click", () => {
        equip(h.id, true);
        document.querySelector(".stage").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
      });

      item.append(fig, plank, title, desc, btn);
      hobbyList.appendChild(item);
    });

    // 말풍선
    function say({ title, line }) {
      bubble.innerHTML = "<strong></strong><span></span>";
      bubble.querySelector("strong").textContent = title;
      bubble.querySelector("span").textContent = line;
      bubble.classList.remove("pop");
      void bubble.offsetWidth;
      bubble.classList.add("pop");
    }

    function hop() {
      cat.classList.remove("hop");
      void cat.getBoundingClientRect();
      cat.classList.add("hop");
    }

    // 소품 착용
    function equip(id, forceOn = false) {
      const current = diorama.dataset.equip;
      const next = current === id && !forceOn ? "" : id;
      diorama.dataset.equip = next;
      props.forEach((p) => p.setAttribute("aria-pressed", String(p.dataset.hobby === next)));
      const hobby = ME.hobbies.find((h) => h.id === next);
      say(hobby ? { title: hobby.title, line: hobby.line } : ME.idle);
      hop();
    }

    props.forEach((p) => {
      const hobby = ME.hobbies.find((h) => h.id === p.dataset.hobby);
      p.setAttribute("aria-label", `${hobby.prop}: ${hobby.title}`);
      p.addEventListener("click", () => equip(p.dataset.hobby));
      p.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          equip(p.dataset.hobby);
        }
      });
    });

    // 인사하기
    let waveTimer;
    document.getElementById("helloBtn").addEventListener("click", (e) => {
      diorama.classList.add("waving");
      clearTimeout(waveTimer);
      waveTimer = setTimeout(() => diorama.classList.remove("waving"), 1700);
      say(ME.hello);
      const r = e.currentTarget.getBoundingClientRect();
      sparkle(r.left + r.width / 2, r.top + r.height / 2);
    });

    const SPARK_COLORS = ["#f7924a", "#ffc58e", "#b9a6ff", "#fff1e0"];
    function sparkle(x, y) {
      if (reduceMotion) return;
      for (let i = 0; i < 14; i++) {
        const s = document.createElementNS(SVG_NS, "svg");
        s.setAttribute("viewBox", "0 0 24 24");
        s.classList.add("spark");
        s.innerHTML = `<path d="M12 1 C13 8 16 11 23 12 C16 13 13 16 12 23 C11 16 8 13 1 12 C8 11 11 8 12 1 Z" fill="${SPARK_COLORS[i % SPARK_COLORS.length]}" />`;
        const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
        const dist = 70 + Math.random() * 90;
        s.style.left = x - 11 + "px";
        s.style.top = y - 11 + "px";
        s.style.setProperty("--x", Math.cos(angle) * dist + "px");
        s.style.setProperty("--y", Math.sin(angle) * dist + "px");
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 950);
      }
    }

    // 눈과 고개가 마우스를 따라와요
    window.addEventListener("pointermove", (e) => {
      const r = diorama.getBoundingClientRect();
      const cx = r.left + r.width * 0.5;
      const cy = r.top + r.height * (270 / 620);
      const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 500));
      const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 400));
      eyes.style.transform = `translate(${dx * 10}px, ${dy * 8}px)`;
      head.style.transform = `rotate(${dx * 4}deg)`;
    });

    // 깜빡깜빡
    (function blink() {
      setTimeout(() => {
        eyes.classList.add("blink");
        setTimeout(() => eyes.classList.remove("blink"), 140);
        blink();
      }, 2500 + Math.random() * 3000);
    })();

    say(ME.idle);
  </script>
</body>
</html>
