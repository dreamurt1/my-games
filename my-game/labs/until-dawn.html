<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새벽까지 · Labs</title>
  <link href="../fonts/pretendard.css" rel="stylesheet">
  <style>
    :root { --night: #0c1233; --indigo: #1b2559; --deep: #121a45; --orange: #ff9a3c; --yellow: #ffd66b; --pale: #ffe9a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--night); }
    body { font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif; color: var(--pale); word-break: keep-all; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
    .back { position: fixed; left: 20px; bottom: 18px; color: rgba(255, 233, 168, 0.55); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--pale); }
    :focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }
    .end {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      padding: 24px; text-align: center; background: rgba(12, 18, 51, 0.55);
      opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
    }
    .end.on { opacity: 1; pointer-events: auto; }
    .end p { max-width: 26em; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.6; }
    .again {
      padding: 12px 26px; border: 1px solid rgba(255, 214, 107, 0.7); border-radius: 999px;
      background: rgba(12, 18, 51, 0.4); color: var(--yellow); font: inherit; font-size: 16px; cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .again:hover { background: var(--yellow); color: var(--night); }
  </style>
</head>
<body>
  <canvas id="c" aria-label="새벽까지: 해를 닮은 구슬을 굴려 별 조각을 모으는 게임"></canvas>
  <a class="back" href="../labs.html">← Labs</a>
  <div class="end" id="end" aria-live="polite">
    <p id="msg"></p>
    <button class="again" id="again" type="button">다시 한 번</button>
  </div>

  <script>
    // ─────────────────────────────────────────────
    // 새벽까지 — 시제품 (마우스 끌기 + 시간)
    // 해를 닮은 구슬이 포인터 쪽으로 굴러가요(관성 있음).
    // 별 조각은 구슬의 빛을 채우고, 그림자에 닿으면 빛이 줄어요.
    // 밤(60초)을 버티면 새벽, 빛이 꺼지면 끝.
    // ─────────────────────────────────────────────
    const TUNE = {
      night: 60,        // 밤의 길이(초)
      drain: 2.5,       // 빛이 1초에 줄어드는 양
      shadowDrain: 34,  // 그림자에 닿아 있는 동안 1초에 줄어드는 빛
      shard: 14,        // 별 조각 하나가 채우는 빛
      pull: 9,          // 포인터 쪽으로 끌리는 힘
      friction: 2.2,    // 구르는 저항 (클수록 빨리 멈춤)
    };

    const cv = document.getElementById("c");
    const g = cv.getContext("2d");
    const endEl = document.getElementById("end");
    const msgEl = document.getElementById("msg");
    let W = 0, H = 0;

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    const rnd = (a, b) => a + Math.random() * (b - a);
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const rgb = (c, a = 1) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;

    let ball, tx, ty, light, time, shards, shadows, bgStars, stars, state, endT, moved;

    function start() {
      ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 13, roll: 0 };
      tx = W / 2; ty = H / 2;
      light = 70; time = 0; stars = 0; endT = 0; moved = false;
      shards = []; shadows = [];
      bgStars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.8, s: Math.random() < 0.2 ? 2 : 1, tw: Math.random() * 6 }));
      state = "play";
      endEl.classList.remove("on");
    }

    const aim = (e) => { tx = e.clientX; ty = e.clientY; moved = true; };
    cv.addEventListener("pointermove", aim);
    cv.addEventListener("pointerdown", aim);
    document.getElementById("again").addEventListener("click", start);

    function addShard() {
      shards.push({ x: rnd(50, W - 50), y: rnd(70, H - 60), life: 7, tw: Math.random() * 6 });
    }

    function addShadow() {
      const fromLeft = Math.random() < 0.5, r = rnd(36, 64);
      shadows.push({ x: fromLeft ? -r * 2 : W + r * 2, y: rnd(60, H - 40), r, vx: (fromLeft ? 1 : -1) * rnd(40, 80 + time * 1.5), vy: rnd(-12, 12), ph: Math.random() * 6 });
    }

    function update(dt) {
      if (state === "play") {
        if (moved) time += dt;
        // 구슬: 포인터 쪽으로 끌리고, 저항으로 천천히 멈춤
        ball.vx += (tx - ball.x) * TUNE.pull * dt;
        ball.vy += (ty - ball.y) * TUNE.pull * dt;
        ball.vx *= Math.exp(-TUNE.friction * dt);
        ball.vy *= Math.exp(-TUNE.friction * dt);
        ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x + ball.vx * dt));
        ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y + ball.vy * dt));
        ball.roll += Math.hypot(ball.vx, ball.vy) * dt / ball.r;

        if (moved) {
          light -= TUNE.drain * dt;
          if (shards.length < 5 && Math.random() < dt * 1.4) addShard();
          const want = 2 + Math.floor(time / 12);
          if (shadows.length < want && Math.random() < dt * 1.5) addShadow();
        }

        shards.forEach((s) => {
          s.life -= dt; s.tw += dt * 4;
          if (Math.hypot(s.x - ball.x, s.y - ball.y) < ball.r + 14) { s.life = 0; s.got = true; stars++; light = Math.min(100, light + TUNE.shard); }
        });
        shards = shards.filter((s) => s.life > 0);

        shadows.forEach((s) => {
          s.x += s.vx * dt; s.y += s.vy * dt; s.ph += dt;
          if (Math.hypot(s.x - ball.x, s.y - ball.y) < s.r * 0.75 + ball.r) light -= TUNE.shadowDrain * dt;
        });
        shadows = shadows.filter((s) => s.x > -s.r * 3 && s.x < W + s.r * 3);

        if (light <= 0) { light = 0; state = "fade"; endT = 0; }
        else if (time >= TUNE.night) { state = "dawn"; endT = 0; }
      } else {
        endT += dt;
        shadows.forEach((s) => { s.x += s.vx * dt * 2; });
        if (endT > 1.6 && !endEl.classList.contains("on")) {
          msgEl.textContent = state === "dawn"
            ? `밤을 건넜어요. 당신이 모은 별 ${stars}조각이 새벽을 불렀어요.`
            : `빛이 잠시 잠들었어요. 그래도 별 ${stars}조각이 당신 곁에 있었어요.`;
          endEl.classList.add("on");
          document.getElementById("again").focus();
        }
      }
    }

    function glow(x, y, r, color, a) {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, color.replace("A", a));
      gr.addColorStop(1, color.replace("A", 0));
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }

    function draw() {
      // 하늘: 밤이 지날수록 아래쪽부터 새벽빛이 올라와요
      let p = Math.min(1, time / TUNE.night);
      if (state === "dawn") p = 1 + Math.min(1, endT / 1.5) * 0.4;
      const top = mix([12, 18, 51], [27, 37, 89], Math.min(1, p));
      const bottom = mix([18, 26, 69], [255, 154, 60], Math.min(1, Math.max(0, p - 0.35) / 0.65));
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, rgb(top));
      sky.addColorStop(0.65, rgb(mix(top, bottom, 0.5)));
      sky.addColorStop(1, rgb(bottom));
      g.fillStyle = sky;
      g.fillRect(0, 0, W, H);
      if (state === "dawn") {
        glow(W / 2, H + 40 - Math.min(1, endT / 1.5) * 120, 260, "rgba(255, 214, 107, A)", 0.7);
      }

      // 배경 별 (새벽이 오면 사라짐)
      bgStars.forEach((s) => {
        s.tw += 0.02;
        g.fillStyle = `rgba(255, 233, 168, ${(0.25 + Math.sin(s.tw) * 0.2) * (1 - Math.min(1, p))})`;
        g.fillRect(s.x * W, s.y * H, s.s, s.s);
      });

      // 그림자
      shadows.forEach((s) => glow(s.x, s.y, s.r * (1.3 + Math.sin(s.ph * 2) * 0.05), "rgba(6, 9, 30, A)", 0.9));

      // 별 조각
      shards.forEach((s) => {
        const a = Math.min(1, s.life) * (0.75 + Math.sin(s.tw) * 0.25);
        glow(s.x, s.y, 22, "rgba(255, 233, 168, A)", 0.5 * a);
        g.save();
        g.translate(s.x, s.y);
        g.rotate(s.tw * 0.2);
        g.fillStyle = `rgba(255, 233, 168, ${a})`;
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const rr = i % 2 ? 2.5 : 7, an = (i / 8) * Math.PI * 2;
          g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
        }
        g.closePath(); g.fill();
        g.restore();
      });

      // 구슬: 빛이 많을수록 더 크고 환하게
      const k = light / 100;
      glow(ball.x, ball.y, 40 + k * 110, "rgba(255, 214, 107, A)", 0.12 + k * 0.3);
      glow(ball.x, ball.y, ball.r * 2.2, "rgba(255, 154, 60, A)", 0.5);
      const core = g.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.r);
      core.addColorStop(0, rgb(mix([255, 154, 60], [255, 233, 168], k)));
      core.addColorStop(1, rgb(mix([120, 60, 30], [255, 154, 60], k)));
      g.fillStyle = core;
      g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); g.fill();
      // 굴러가는 느낌: 작은 무늬가 돌아요
      g.fillStyle = "rgba(255, 233, 168, 0.55)";
      g.beginPath(); g.arc(ball.x + Math.cos(ball.roll) * ball.r * 0.5, ball.y + Math.sin(ball.roll) * ball.r * 0.5, 2.2, 0, Math.PI * 2); g.fill();

      // HUD: 위쪽에 밤 → 새벽 진행선, 왼쪽 위에 모은 별
      g.fillStyle = "rgba(255, 233, 168, 0.12)";
      g.fillRect(0, 0, W, 3);
      g.fillStyle = "rgba(255, 214, 107, 0.8)";
      g.fillRect(0, 0, W * Math.min(1, time / TUNE.night), 3);
      g.font = "600 18px 'Pretendard Variable', sans-serif";
      g.textAlign = "left";
      g.fillStyle = "#ffe9a8";
      g.beginPath();
      for (let i = 0; i < 8; i++) { const rr = i % 2 ? 2.2 : 7, an = (i / 8) * Math.PI * 2; g.lineTo(30 + Math.cos(an) * rr, 32 + Math.sin(an) * rr); }
      g.closePath(); g.fill();
      g.fillText(String(stars), 44, 38);

      if (!moved && state === "play") {
        g.textAlign = "center";
        g.font = "15px 'Pretendard Variable', sans-serif";
        g.fillStyle = "rgba(255, 233, 168, 0.7)";
        g.fillText("구슬이 가야 할 곳을 가리켜 보세요", W / 2, H / 2 + 64);
      }
    }

    let last = 0;
    function frame(t) {
      const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
      last = t;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    start();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
