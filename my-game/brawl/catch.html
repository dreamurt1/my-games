<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ryan-portfolio · record catch (brawl)</title>
  <!-- 브롤 스타일 글꼴: Lilita One + Black Han Sans (내 폴더에 있는 파일, 출처는 CREDITS.md) -->
  <link href="../fonts/brawl-fonts.css" rel="stylesheet">
  <link href="brawl.css" rel="stylesheet">
  <style>
    .board { max-width: 800px; --screen-ratio: 4 / 3; }
    .screen { aspect-ratio: 4 / 3; cursor: none; }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="btn-ghost" href="arcade.html" id="backLink" aria-label="아케이드로 돌아가기"><span data-icon="back"></span><span class="label">Back</span></a>
      <div class="top-right">
        <span class="hi"><span data-icon="trophy"></span>HI <span id="best">000000</span></span>
        <button class="btn-ghost" id="soundBtn" type="button"></button>
      </div>
    </header>

    <h1 class="band">CATCH</h1>
    <p class="how">떨어지는 레코드판을 고양이로 받아요. 빨간 가시 폭탄은 피하세요.<br><span class="desk-only">방향키 · A/D 또는 마우스로 움직이고, ESC로 잠시 멈춰요.</span><span class="touch-only">화면을 손가락으로 끌어서 고양이를 움직여요.</span></p>

    <main class="board">
      <canvas class="screen" id="game" width="256" height="192" aria-label="레코드 받기 게임 화면"></canvas>
      <div class="hud">
        <span class="chip"><span data-icon="star"></span>Score <span class="num" id="score">000000</span></span>
        <span class="hearts" id="lives" aria-label="남은 목숨"></span>
      </div>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">Record Catch</h2>
        <p id="overlayText">레코드판은 +1점, 빨간 가시 폭탄에 닿으면 목숨이 하나 줄어요.</p>
        <div class="actions">
          <button class="btn-ghost" id="quitBtn" type="button" hidden>Quit</button>
          <button class="btn" id="playBtn" type="button">Play</button>
        </div>
        <p class="press blink desk-only" id="press">PRESS ENTER</p>
      </div>
    </main>
  </div>

  <script src="../retro.js"></script>
  <script src="toon.js"></script>
  <script>
    Toon.icons();
    Toon.mountMute(document.getElementById("soundBtn"));

    // 뒤로 가기: arcade.html에서 왔다면 브라우저 기록으로 되돌아가요
    document.getElementById("backLink").addEventListener("click", (e) => {
      if (document.referrer && /arcade\.html?$/.test(document.referrer) && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });

    // ── 게임 (게임 좌표는 256×192, 그림은 3배로 선명하게) ──
    const canvas = document.getElementById("game");
    const W = 256, H = 192;
    const ctx = Toon.setup(canvas, W, H, 3);
    const GROUND = H - 14;
    const C = Toon.C;

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const pressEl = document.getElementById("press");
    const playBtn = document.getElementById("playBtn");
    const quitBtn = document.getElementById("quitBtn");

    let best = 0;
    try { best = Number(localStorage.getItem("arcade-best")) || 0; } catch (e) {}
    bestEl.textContent = Retro.pad(best);

    // 배경(하늘 · 언덕 · 잔디)은 한 번만 그려 두고 매 프레임 복사해요
    const bg = document.createElement("canvas");
    function drawBg() {
      const g = Toon.setup(bg, W, H, 3);
      Toon.sky(g, W, H, { top: C.skyHi, bottom: "#8fd0ff", rays: 16 });
      // 해: 노란 동그라미 + 반짝이
      Toon.ball(g, W - 40, 30, 15, C.sun, { line: 2, shade: 0.12 });
      // 먼 언덕 두 겹 (뒤는 연한 초록, 앞은 진한 초록)
      const hill = (base, amp, col, k) => {
        g.beginPath(); g.moveTo(-4, H);
        for (let x = -4; x <= W + 4; x += 4) g.lineTo(x, base - amp * (0.6 + 0.4 * Math.sin(x / k) * Math.cos(x / (k * 2.3))));
        g.lineTo(W + 4, H); g.closePath();
        g.fillStyle = col; g.fill(); g.lineWidth = 1.6; g.strokeStyle = C.ink; g.stroke();
      };
      hill(GROUND - 18, 26, "#7fd98a", 26);
      hill(GROUND - 4, 16, "#48c25a", 17);
      // 잔디 땅: 위쪽은 밝은 잔디, 아래는 흙
      g.fillStyle = "#c9824a"; g.fillRect(0, GROUND, W, H - GROUND);
      g.fillStyle = "#a9653a";
      for (let x = 6; x < W; x += 22) { g.beginPath(); g.ellipse(x, GROUND + 9 + (x % 3), 3, 1.6, 0, 0, Math.PI * 2); g.fill(); }
      g.beginPath(); g.moveTo(0, GROUND + 4);
      for (let x = 0; x <= W; x += 8) g.quadraticCurveTo(x + 4, GROUND + 7, x + 8, GROUND + 4);
      g.lineTo(W, GROUND - 1); g.lineTo(0, GROUND - 1); g.closePath();
      g.fillStyle = C.leaf; g.fill(); g.lineWidth = 1.6; g.strokeStyle = C.ink; g.stroke();
      g.fillStyle = C.leafHi; g.fillRect(0, GROUND - 1, W, 1.4);
    }
    drawBg();

    // 천천히 흘러가는 구름
    const clouds = [{ x: 30, y: 26, s: 1 }, { x: 140, y: 46, s: 0.75 }, { x: 210, y: 70, s: 0.6 }];
    function cloud(x, y, s) {
      const p = new Path2D();
      [[0, 0, 11], [11, -5, 9], [22, 0, 10], [11, 4, 9]].forEach(([dx, dy, r]) => { p.moveTo(x + dx * s + r * s, y + dy * s); p.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2); });
      ctx.lineWidth = 3.2 * s; ctx.strokeStyle = C.ink; ctx.stroke(p);
      ctx.fillStyle = C.milk; ctx.fill(p);
    }

    const cat = { x: W / 2, target: W / 2, speed: 3.6, blinkIn: 120, blink: 0, bob: 0, mood: 0, moodName: "default", squash: 0 };
    const CAT_Y = GROUND - 30;
    const keys = { left: false, right: false };
    let items = [], pops = [], score = 0, lives = 3, running = false, paused = false, spawnIn = 0, shake = 0, last = 0, tick = 0;

    function hearts() {
      livesEl.innerHTML = [0, 1, 2].map((i) => `<span class="${i < lives ? "on" : "off"}">${Toon.icon("heart")}</span>`).join("");
      livesEl.setAttribute("aria-label", `남은 목숨 ${lives}개`);
    }

    function reset() {
      items = []; pops = []; score = 0; lives = 3; spawnIn = 30; shake = 0;
      cat.x = cat.target = W / 2; cat.mood = 0; cat.squash = 0;
      scoreEl.textContent = Retro.pad(0);
      hearts();
    }

    const LABELS = [C.berry, C.sun, C.grape, C.leaf, C.cat];
    function spawn() {
      const bad = Math.random() < 0.26;
      items.push({
        x: 10 + Math.random() * (W - 32),
        y: -14,
        r: 6,
        bad,
        vy: Math.min(3.2, 0.95 + score * 0.025 + Math.random() * 0.5),
        t: Math.floor(Math.random() * 12),
        label: LABELS[Math.floor(Math.random() * LABELS.length)],
      });
    }

    // 레코드판: 반짝이는 검은 판 + 색 라벨, 빙글빙글 돌아요
    function record(it) {
      const { x, y, r } = it, a = (it.t + tick) * 0.12;
      Toon.ball(ctx, x, y, r + 1.5, "#2a2140", { line: 1.6, shade: 0, shine: false });
      ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.arc(x, y, r - 0.6, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r - 2.4, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.2; // 돌아가는 반짝이
      ctx.beginPath(); ctx.arc(x, y, r - 1.2, a, a + 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r - 1.2, a + Math.PI, a + Math.PI + 0.9); ctx.stroke();
      Toon.ball(ctx, x, y, 2.8, it.label, { line: 0.9, shade: 0, shine: false });
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(x, y, 0.8, 0, Math.PI * 2); ctx.fill();
    }

    // 나쁜 것: 빨간 가시 폭탄 + 흰 X
    function bomb(it) {
      const { x, y } = it, r = 6, a = (it.t + tick) * 0.05;
      const p = new Path2D();
      for (let i = 0; i < 16; i++) {
        const ang = a + (i * Math.PI) / 8, rad = i % 2 ? r : r + 2.6;
        const px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
        i ? p.lineTo(px, py) : p.moveTo(px, py);
      }
      p.closePath();
      ctx.lineWidth = 1.6; ctx.strokeStyle = C.ink; ctx.fillStyle = C.berry;
      ctx.fill(p); ctx.stroke(p);
      ctx.fillStyle = C.berryLo; ctx.beginPath(); ctx.arc(x + 1, y + 1.4, r * 0.7, 0, Math.PI); ctx.fill();
      ctx.lineCap = "round";
      ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - 2.6, y - 2.6); ctx.lineTo(x + 2.6, y + 2.6); ctx.moveTo(x + 2.6, y - 2.6); ctx.lineTo(x - 2.6, y + 2.6); ctx.stroke();
      ctx.strokeStyle = C.milk; ctx.lineWidth = 1.4; ctx.stroke();
    }

    // 고양이: 얼굴 + 동그란 앞발 두 개, 받으면 납작 · 맞으면 어질어질
    function drawCat() {
      const k = cat.squash > 0 ? Math.sin((cat.squash / 14) * Math.PI) : 0;
      const sx = 1 + k * 0.14, sy = 1 - k * 0.12;
      const cx = cat.x, base = GROUND;
      // 그림자
      ctx.fillStyle = "rgba(18,12,36,0.25)";
      ctx.beginPath(); ctx.ellipse(cx, base + 1, 15 * sx, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(cx, base + cat.bob);
      ctx.scale(sx, sy);
      // 앞발
      [-8, 8].forEach((d) => Toon.ball(ctx, d, -3, 4.2, C.cat, { line: 1.4, shade: 0.2, shine: false }));
      // 가장 가까운 레코드 쪽을 바라봐요
      let look = 0, near = 1e9;
      items.forEach((it) => { if (!it.bad && it.y < CAT_Y + 10) { const d = Math.abs(it.x - cx); if (d < near) { near = d; look = Math.max(-1, Math.min(1, (it.x - cx) / 40)); } } });
      let mood = cat.mood > 0 ? cat.moodName : cat.blink > 0 ? "blink" : "default";
      if (mood === "default" && items.some((it) => it.bad && Math.abs(it.x - cx) < 22 && it.y > CAT_Y - 40 && it.y < CAT_Y + 10)) mood = "wow"; // 폭탄이 가까우면 깜짝
      Toon.cat(ctx, 0, -16, 34, { coat: C.cat, mood, look, t: tick });
      ctx.restore();
    }

    function drawScene() {
      ctx.drawImage(bg, 0, 0, W, H);
      clouds.forEach((c) => cloud(((c.x + tick * 0.08 * c.s) % (W + 50)) - 25, c.y, c.s));

      // 떨어지는 물건은 땅 위에서만 보여요 (땅에 닿으면 흙 속으로 사라지는 것처럼)
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GROUND - 1); ctx.clip();
      items.forEach((it) => (it.bad ? bomb(it) : record(it)));
      ctx.restore();
      drawCat();

      pops.forEach((p) => {
        const k = Math.min(1, (30 - p.life) / 8);
        const size = 10 + Toon.springOut(k) * 4;
        ctx.globalAlpha = p.life < 8 ? p.life / 8 : 1;
        Toon.text(ctx, p.text, p.x, p.y, { size, color: p.color });
        ctx.globalAlpha = 1;
      });
    }

    function update(step) {
      tick++;
      if (keys.left) cat.target -= cat.speed * step;
      if (keys.right) cat.target += cat.speed * step;
      cat.target = Math.max(18, Math.min(W - 18, cat.target));
      const dx = (cat.target - cat.x) * Math.min(1, 0.35 * step);
      cat.x += dx;
      // 움직이는 동안 통통
      cat.bob = Math.abs(dx) > 0.3 ? -Math.abs(Math.sin(tick / 4)) * 2 : 0;
      if (cat.blink > 0) cat.blink -= step;
      else if ((cat.blinkIn -= step) <= 0) { cat.blink = 8; cat.blinkIn = 120 + Math.random() * 140; }
      if (cat.mood > 0) cat.mood -= step;
      if (cat.squash > 0) cat.squash -= step;

      spawnIn -= step;
      if (spawnIn <= 0) {
        spawn();
        spawnIn = Math.max(20, 46 - score * 0.6);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy * step;
        const hit = Math.hypot(it.x - cat.x, it.y - (CAT_Y + 18)) < it.r + 14;
        if (hit) {
          items.splice(i, 1);
          if (it.bad) {
            lives--;
            shake = 12;
            cat.mood = 40; cat.moodName = "dizzy";
            pops.push({ x: it.x, y: it.y - 8, text: "-1", color: C.berry, life: 30 });
            hearts();
            Retro.sfx("hit");
            if (lives <= 0) return gameOver();
            Toon.buzz("hit");
          } else {
            score++;
            cat.mood = 18; cat.moodName = "happy"; cat.squash = 14;
            pops.push({ x: it.x, y: it.y - 8, text: "+1", color: C.sun, life: 30 });
            scoreEl.textContent = Retro.pad(score);
            Retro.sfx("coin");
            Toon.buzz(score % 10 === 0 ? "good" : "pick"); // 10점마다 조금 더 신나게
          }
        } else if (it.y > H + 14) {
          items.splice(i, 1);
        }
      }

      pops.forEach((p) => { p.y -= 0.5 * step; p.life -= step; });
      pops = pops.filter((p) => p.life > 0);
      if (shake > 0) shake -= step;
    }

    function frame(t) {
      if (!running) return;
      const step = last ? Math.min(3, (t - last) / 16.67) : 1;
      last = t;
      update(step);
      if (!running) return;
      // 맞으면 화면이 좌우로 흔들려요
      canvas.style.transform = shake > 0 ? `translateX(${Math.floor(t / 50) % 2 ? 4 : -4}px)` : "";
      drawScene();
      requestAnimationFrame(frame);
    }

    function start() {
      reset();
      overlay.hidden = true;
      quitBtn.hidden = true;
      paused = false;
      running = true;
      last = 0;
      Retro.sfx("start");
      requestAnimationFrame(frame);
    }

    function showOverlay(title, text, btnText, withQuit) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      playBtn.textContent = btnText;
      quitBtn.hidden = !withQuit;
      pressEl.textContent = withQuit ? "PRESS ESC" : "PRESS ENTER";
      overlay.hidden = false;
      playBtn.focus();
    }

    function saveBest() {
      if (score > best) {
        best = score;
        bestEl.textContent = Retro.pad(best);
        try { localStorage.setItem("arcade-best", String(best)); } catch (e) {}
        return true;
      }
      return false;
    }

    // ESC: 잠시 멈춤
    function pause() {
      if (!running) return;
      running = false;
      paused = true;
      keys.left = keys.right = false;
      canvas.style.transform = "";
      Retro.sfx("pause");
      showOverlay("Paused", `지금 ${score}점 · 목숨 ${lives}개. 계속할까요?`, "Resume", true);
    }

    function resume() {
      if (!paused) return;
      paused = false;
      overlay.hidden = true;
      quitBtn.hidden = true;
      running = true;
      last = 0;
      Retro.sfx("resume");
      requestAnimationFrame(frame);
    }

    // QUIT: 이번 판을 끝내고 첫 화면으로
    function quit() {
      paused = false;
      saveBest();
      reset();
      drawScene();
      Retro.sfx("select");
      showOverlay("Record Catch", "레코드판은 +1점, 빨간 가시 폭탄에 닿으면 목숨이 하나 줄어요.", "Play", false);
    }

    function gameOver() {
      running = false;
      canvas.style.transform = "";
      drawScene();
      const record = saveBest();
      Retro.sfx("over");
      Toon.buzz(record ? "win" : "over"); // 새 기록이면 축하 진동, 아니면 아주 강한 진동
      showOverlay(record ? "New Record!" : "Game Over", `이번 점수는 ${score}점이에요. 최고 기록은 ${best}점!`, "Retry", false);
    }

    playBtn.addEventListener("click", () => (paused ? resume() : start()));
    quitBtn.addEventListener("click", quit);

    // 다른 탭으로 가면 자동으로 멈춰요
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (running) pause();
        else if (paused) resume();
        return;
      }
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; if (running) e.preventDefault(); }
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; if (running) e.preventDefault(); }
      if ((e.key === "Enter" || e.key === " ") && !running && !paused && document.activeElement !== playBtn && document.activeElement !== quitBtn) { e.preventDefault(); start(); }
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    // 마우스 · 손가락 위치 → 게임 좌표 (캔버스는 3배로 커졌지만 게임 좌표 W로 바꿔요)
    const aim = (e) => {
      const r = canvas.getBoundingClientRect();
      cat.target = ((e.clientX - r.left) / r.width) * W;
    };
    canvas.addEventListener("pointermove", aim);
    canvas.addEventListener("pointerdown", aim);

    // 시작 전에도 장면을 보여줘요 (글꼴이 준비되면 한 번 더)
    reset();
    drawScene();
    Toon.ready(() => { if (!running) drawScene(); });
  </script>
</body>
</html>
