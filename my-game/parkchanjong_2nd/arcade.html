<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ryan-portfolio · arcade</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <!-- 임시 게임 폰트: Galmuri11 (한글 픽셀 폰트) -->
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
  <style>
    :root {
      /* 인디고 브랜드 팔레트 (예전 치비 페이지 색) */
      --ink-deep: #1a0b3b;
      --ink: #2b1055;
      --lilac-deep: #7c5cff;
      --lilac: #b9a6ff;
      --text-soft: #d2c6f7;
      --cream: #fff1e0;
      --orange: #f7924a;
      --orange-hi: #ffc58e;
      --orange-lo: #d8692e;
      --danger: #ff6b6b;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scrollbar-color: var(--lilac-deep) var(--ink-deep); }

    body {
      font-family: 'Galmuri11', 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif;
      font-weight: 500;
      color: var(--cream);
      background-color: var(--ink-deep);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(124, 92, 255, 0.22), transparent 70%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.82  0 0 0 0 0.78  0 0 0 0 1  0 0 0 0.07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-attachment: fixed;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--lilac-deep); color: var(--cream); }
    :focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 4px; }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding-inline: clamp(1.25rem, 5vw, 3.5rem);
      padding-bottom: 3rem;
    }

    /* 맨 위: 뒤로 가기 + ARCADE 띠 */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.5rem 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.1rem 0.7rem 0.9rem;
      border: 2px solid var(--lilac);
      color: var(--cream);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background 0.3s var(--ease-out), color 0.3s var(--ease-out), border-color 0.3s var(--ease-out);
    }

    .back-link svg { width: 1.1rem; height: 1.1rem; transition: transform 0.4s var(--ease-out); }
    .back-link:hover { background: var(--cream); border-color: var(--cream); color: var(--ink-deep); }
    .back-link:hover svg { transform: translateX(-4px); }

    .band {
      padding-block: clamp(1rem, 2.5vw, 1.75rem);
      padding-left: 0.16em;
      border-block: 2px solid var(--lilac-deep);
      text-align: center;
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      color: var(--cream);
      text-shadow: 4px 4px 0 var(--lilac-deep);
    }

    .how {
      margin-top: 1.5rem;
      text-align: center;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      line-height: 1.6;
      color: var(--text-soft);
    }

    /* 게임 선택: 두 장의 게임 카드 */
    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1.25rem, 3vw, 2rem);
      margin-top: clamp(1.75rem, 4vw, 2.75rem);
      list-style: none;
    }

    .card {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: clamp(10px, 1.6vw, 14px);
      background: var(--ink);
      border: 2px solid var(--lilac-deep);
      box-shadow: 0 0 0 6px var(--ink-deep), 0 22px 40px rgba(5, 0, 20, 0.6);
      color: var(--cream);
      text-decoration: none;
      transition: transform 0.4s var(--ease-out), border-color 0.3s var(--ease-out);
    }

    .card:hover { transform: translateY(-6px); border-color: var(--orange); }

    .card svg { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }

    .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.6rem;
      padding: 1.1rem 0.4rem 0.4rem;
    }

    .card-no { font-size: 0.85rem; letter-spacing: 0.16em; color: var(--lilac); }

    .card h2 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--orange-hi);
    }

    .card p { font-size: 1rem; line-height: 1.6; color: var(--text-soft); }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: auto;
      padding-top: 0.8rem;
    }

    .card-best { font-size: 0.95rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
    .card-best span { color: var(--orange-hi); }

    .card-play {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1.2rem;
      background: var(--orange);
      color: var(--ink-deep);
      box-shadow: 0 4px 0 var(--orange-lo);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: background 0.3s var(--ease-out);
    }

    .card-play svg { width: 1.1rem; height: 1.1rem; aspect-ratio: auto; transition: transform 0.4s var(--ease-out); }
    .card:hover .card-play { background: var(--orange-hi); }
    .card:hover .card-play svg { transform: translateX(4px); }

    @media (max-width: 900px) {
      .games { grid-template-columns: 1fr; max-width: 480px; margin-inline: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="back-link" href="index.html" id="backLink">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 H5 M11 6 L5 12 L11 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" /></svg>
        <span>Back</span>
      </a>
    </header>

    <h1 class="band">ARCADE</h1>
    <p class="how">플레이할 게임을 골라요.</p>

    <ul class="games">
      <li>
        <a class="card" href="catch.html">
          <!-- 미리보기: 밤하늘에서 떨어지는 레코드와 주황 고양이 -->
          <svg viewBox="0 0 320 240" aria-hidden="true">
            <defs>
              <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#120630" /><stop offset=".7" stop-color="#2b1055" /><stop offset="1" stop-color="#3d1a78" />
              </linearGradient>
            </defs>
            <rect width="320" height="240" fill="url(#sky1)" />
            <g fill="#d2c6f7" opacity=".7"><rect x="30" y="28" width="3" height="3" /><rect x="96" y="60" width="2" height="2" /><rect x="150" y="22" width="3" height="3" /><rect x="214" y="70" width="2" height="2" /><rect x="60" y="120" width="2" height="2" /><rect x="190" y="130" width="3" height="3" /></g>
            <circle cx="270" cy="46" r="22" fill="#ffc58e" /><circle cx="280" cy="40" r="20" fill="#16082f" />
            <g stroke="#b9a6ff" stroke-width="2"><circle cx="80" cy="84" r="11" fill="#1a0b3b" /><circle cx="168" cy="136" r="11" fill="#1a0b3b" /></g>
            <circle cx="80" cy="84" r="4" fill="#f7924a" /><circle cx="168" cy="136" r="4" fill="#f7924a" />
            <path d="M226 96 l16 16 M242 96 l-16 16" stroke="#ff6b6b" stroke-width="5" />
            <path d="M0 226 C96 214 192 236 320 220 V240 H0 Z" fill="#1a0b3b" />
            <g transform="translate(160 200)">
              <path d="M-26 -4 L-19 -36 L-4 -18 Z M26 -4 L19 -36 L4 -18 Z" fill="#d8692e" />
              <ellipse rx="27" ry="22" fill="#f7924a" />
              <ellipse cx="-10" cy="-3" rx="6" ry="5" fill="#fff1e0" /><ellipse cx="10" cy="-3" rx="6" ry="5" fill="#fff1e0" />
              <circle cx="-9" cy="-2" r="3" fill="#1a0b3b" /><circle cx="11" cy="-2" r="3" fill="#1a0b3b" />
              <ellipse cy="8" rx="10" ry="11" fill="#fff1e0" />
              <path d="M-3 5 H3 L0 9 Z" fill="#1a0b3b" />
            </g>
          </svg>
          <div class="card-body">
            <span class="card-no">GAME 01</span>
            <h2>Record Catch</h2>
            <p>떨어지는 레코드판을 고양이로 받아요. 빨간 X는 피하세요.</p>
            <div class="card-foot">
              <span class="card-best">Best <span id="bestCatch">0</span></span>
              <span class="card-play">Play <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" /></svg></span>
            </div>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="puzzle.html">
          <!-- 미리보기: 3×3으로 섞인 고양이 조각 -->
          <svg viewBox="0 0 320 240" aria-hidden="true">
            <rect width="320" height="240" fill="#1a0b3b" />
            <g transform="translate(70 30)">
              <rect width="58" height="58" fill="#2b1055" /><path d="M10 58 L30 8 L50 58 Z" fill="#d8692e" />
              <rect x="62" width="58" height="58" fill="#120630" /><circle cx="91" cy="29" r="15" fill="#ffc58e" /><circle cx="98" cy="24" r="14" fill="#120630" />
              <rect x="124" width="58" height="58" fill="#2b1055" /><path d="M134 58 L154 8 L174 58 Z" fill="#d8692e" />
              <rect y="62" width="58" height="58" fill="#f7924a" /><ellipse cx="29" cy="91" rx="12" ry="10" fill="#fff1e0" /><circle cx="31" cy="92" r="5" fill="#1a0b3b" />
              <rect x="62" y="62" width="58" height="58" fill="#2b1055" /><g stroke="#b9a6ff" stroke-width="2.5"><circle cx="91" cy="91" r="16" fill="#0d0520" /></g><circle cx="91" cy="91" r="5" fill="#f7924a" />
              <rect x="124" y="62" width="58" height="58" fill="#f7924a" /><ellipse cx="153" cy="91" rx="12" ry="10" fill="#fff1e0" /><circle cx="155" cy="92" r="5" fill="#1a0b3b" />
              <rect y="124" width="58" height="58" fill="#f7924a" /><path d="M0 150 H40 M0 164 H38" stroke="#fff1e0" stroke-width="3" />
              <rect x="62" y="124" width="58" height="58" fill="#f7924a" /><ellipse cx="91" cy="150" rx="18" ry="16" fill="#fff1e0" /><path d="M85 140 H97 L91 147 Z" fill="#1a0b3b" />
              <rect x="124" y="124" width="58" height="58" fill="#2b1055" stroke="#ffc58e" stroke-width="3" /><path d="M126 150 H162 M126 164 H160" stroke="#fff1e0" stroke-width="3" />
            </g>
          </svg>
          <div class="card-body">
            <span class="card-no">GAME 02</span>
            <h2>Cat Puzzle</h2>
            <p>여러 모양의 고양이들을 끌어다 5×5 방에 빈틈없이 채워요.</p>
            <div class="card-foot">
              <span class="card-best">Clear <span id="bestPuzzle">0</span>/3</span>
              <span class="card-play">Play <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" /></svg></span>
            </div>
          </div>
        </a>
      </li>
      <li>
        <a class="card" href="run.html">
          <!-- 미리보기: 스피커를 뛰어넘는 고양이 -->
          <svg viewBox="0 0 320 240" aria-hidden="true">
            <defs>
              <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#120630" /><stop offset=".7" stop-color="#2b1055" /><stop offset="1" stop-color="#3d1a78" />
              </linearGradient>
            </defs>
            <rect width="320" height="240" fill="url(#sky3)" />
            <g fill="#d2c6f7" opacity=".7"><rect x="40" y="36" width="3" height="3" /><rect x="120" y="70" width="2" height="2" /><rect x="180" y="30" width="3" height="3" /><rect x="230" y="96" width="2" height="2" /><rect x="70" y="110" width="2" height="2" /></g>
            <circle cx="268" cy="48" r="20" fill="#ffc58e" /><circle cx="277" cy="42" r="18" fill="#16082f" />
            <rect y="186" width="320" height="54" fill="#1a0b3b" /><rect y="186" width="320" height="2" fill="#7c5cff" />
            <g fill="#b9a6ff" opacity=".45"><rect x="20" y="202" width="18" height="2" /><rect x="110" y="214" width="12" height="2" /><rect x="200" y="206" width="22" height="2" /><rect x="280" y="218" width="10" height="2" /></g>
            <g>
              <rect x="186" y="146" width="30" height="40" fill="#1a0b3b" stroke="#7c5cff" stroke-width="2.5" />
              <circle cx="201" cy="170" r="8" fill="none" stroke="#b9a6ff" stroke-width="2" /><circle cx="201" cy="170" r="3" fill="#f7924a" />
              <rect x="252" y="158" width="26" height="28" fill="#1a0b3b" stroke="#7c5cff" stroke-width="2.5" />
              <circle cx="265" cy="174" r="6.5" fill="none" stroke="#b9a6ff" stroke-width="2" /><circle cx="265" cy="174" r="2.5" fill="#f7924a" />
            </g>
            <g transform="translate(110 136)">
              <path d="M-20 -26 Q-40 -34 -36 -50" fill="none" stroke="#d8692e" stroke-width="7" stroke-linecap="round" />
              <path d="M-12 -16 L-6 -4 M12 -16 L18 -4" stroke="#d8692e" stroke-width="7" stroke-linecap="round" />
              <ellipse cy="-24" rx="25" ry="15" fill="#f7924a" />
              <g transform="translate(22 -40)">
                <path d="M-14 -6 L-10 -24 L-1 -12 Z M4 -12 L12 -24 L15 -4 Z" fill="#d8692e" />
                <ellipse rx="16" ry="14" fill="#f7924a" />
                <ellipse cx="7" cy="5" rx="8" ry="7" fill="#fff1e0" /><ellipse cx="4" cy="-3" rx="5" ry="4.5" fill="#fff1e0" />
                <circle cx="5" cy="-3" r="2.6" fill="#1a0b3b" /><path d="M10 2 H15 L12.5 5 Z" fill="#1a0b3b" />
              </g>
            </g>
          </svg>
          <div class="card-body">
            <span class="card-no">GAME 03</span>
            <h2>Cat Run</h2>
            <p>밤길을 달리며 스피커를 뛰어넘고, 날아오는 레코드를 피해요.</p>
            <div class="card-foot">
              <span class="card-best">Best <span id="bestRun">0</span></span>
              <span class="card-play">Play <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" /></svg></span>
            </div>
          </div>
        </a>
      </li>
    </ul>
  </div>

  <script>
    // 뒤로 가기: index.html에서 왔다면 브라우저 기록으로 되돌아가요
    document.getElementById("backLink").addEventListener("click", (e) => {
      if (document.referrer && /index\.html?$/.test(document.referrer) && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });

    // 각 게임의 최고 기록 (점수 / 최소 횟수)
    function showBest() {
      try {
        document.getElementById("bestCatch").textContent = Number(localStorage.getItem("arcade-best")) || 0;
        document.getElementById("bestPuzzle").textContent = Number(localStorage.getItem("puzzle-clear")) || 0;
        document.getElementById("bestRun").textContent = Number(localStorage.getItem("run-best")) || 0;
      } catch (e) {}
    }
    showBest();
    // 게임에서 뒤로 돌아왔을 때도 기록을 새로 보여줘요
    window.addEventListener("pageshow", showBest);
  </script>
</body>
</html>
