<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ryan-portfolio</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <style>
    :root {
      --paper: #f2e4c4;
      --paper-deep: #e9d7b0;
      --ink: #1f1a17;
      --ink-soft: #4a3f36;
      --coral: #e2574a;
      --teal: #1f93a8;
      --mustard: #e6a23c;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scrollbar-color: var(--ink-soft) var(--paper-deep); }

    body {
      font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif;
      font-weight: 500;
      color: var(--ink);
      background-color: var(--paper);
      /* 종이 결 */
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.2  0 0 0 0.16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      word-break: keep-all;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--coral); color: var(--paper); }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding-inline: clamp(1.25rem, 5vw, 3.5rem);
    }

    /* 맨 위 WELCOME 띠 */
    .welcome-band {
      margin-top: clamp(1.25rem, 3vw, 2rem);
      border-top: 2px solid var(--ink);
      padding-block: clamp(1.25rem, 3vw, 2.25rem);
      padding-left: 0.16em;
      border-bottom: 2px solid var(--ink);
      text-align: center;
      font-size: clamp(2.6rem, 9vw, 6rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      color: #e6bfa8;
    }

    /* ── 첫 화면 ────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
      align-items: center;
      gap: clamp(2rem, 5vw, 5rem);
      min-height: min(calc(100svh - 5rem), 56rem);
      padding-block: clamp(2.5rem, 6vw, 4.5rem);
    }

    h1 {
      font-size: clamp(3.4rem, 7.6vw, 6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.02em;
    }

    h1 .name { color: var(--coral); }

    .intro {
      margin-top: 1.75rem;
      max-width: 24ch;
      font-size: clamp(1.15rem, 1.7vw, 1.35rem);
      line-height: 1.65;
      color: var(--ink-soft);
      white-space: pre-line;
    }


    .intro-more { margin-top: 0; }

    .rule {
      width: 3.5rem;
      height: 4px;
      margin-block: 1.6rem;
      background: var(--ink);
    }

    /* 게임 페이지로 가는 버튼: 먹색 판에 찍은 글자 */
    .arcade-link {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      margin-top: 2.25rem;
      padding: 0.95rem 1.35rem 0.95rem 1.6rem;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      box-shadow: 0 10px 18px rgba(60, 40, 20, 0.22);
      transition: background 0.3s var(--ease-out), transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
    }

    .arcade-link svg { width: 1.25rem; height: 1.25rem; transition: transform 0.4s var(--ease-out); }

    .arcade-link:hover {
      background: #b23c2c;
      transform: translateY(-3px);
      box-shadow: 0 16px 24px rgba(60, 40, 20, 0.28);
    }

    .arcade-link:hover svg { transform: translateX(4px); }

    .poster-wrap { justify-self: center; width: 100%; max-width: 520px; }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82svh;
      margin-inline: auto;
      filter: drop-shadow(0 18px 22px rgba(60, 40, 20, 0.22));
      transition: transform 0.6s var(--ease-out), filter 0.6s var(--ease-out);
    }

    .poster:hover {
      transform: translateY(-6px) rotate(-0.6deg);
      filter: drop-shadow(0 26px 28px rgba(60, 40, 20, 0.28));
    }

    .eyelid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); transition: transform 0.09s; }
    .blink .eyelid { transform: scaleY(1); }

    /* ── 취미 ──────────────────────────────── */
    .hobbies {
      padding-bottom: clamp(1rem, 3vw, 2rem);
      border-top: 2px solid var(--ink);
    }

    h2 {
      font-size: clamp(2.2rem, 4.6vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    h2 .name { color: var(--coral); }

    .page-date {
      padding-bottom: 2rem;
      text-align: right;
      font-size: 1.35rem;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* 취미 한 칸: 왼쪽 판화, 오른쪽 설명. 칸 사이는 실선으로 나눠요 (마지막 칸 아래는 선 없음) */
    .print {
      display: grid;
      grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
      grid-template-rows: 1fr auto 1fr;
      column-gap: clamp(2rem, 6vw, 5.5rem);
      padding-block: clamp(2.5rem, 6vw, 4.5rem);
    }

    .print + .print { border-top: 2px solid var(--ink); }

    .print svg {
      grid-row: 1 / -1;
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 16px rgba(60, 40, 20, 0.2));
      transition: transform 0.6s var(--ease-out), filter 0.6s var(--ease-out);
    }

    .print svg:hover {
      transform: translateY(-6px) rotate(-0.6deg);
      filter: drop-shadow(0 22px 24px rgba(60, 40, 20, 0.26));
    }

    .print h3 {
      grid-column: 2;
      grid-row: 1;
      align-self: end;
      font-size: clamp(1.7rem, 3.2vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    /* 음악 칸의 장르 해시태그 */
    .tags {
      grid-column: 2;
      grid-row: 1 / -1;
      align-self: center;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.6rem;
      max-width: 36rem;
      list-style: none;
      font-size: clamp(1.3rem, 2.2vw, 1.75rem);
      font-weight: 500;
      color: var(--ink-soft);
      letter-spacing: -0.02em;
      line-height: 1.35;
    }

    .tags li::before {
      content: "#";
      margin-right: 0.12em;
      color: var(--ink-soft);
    }

    /* 판화를 오른쪽에 두는 칸: 태그는 판화 왼쪽에 붙어 오른쪽 정렬 */
    .print--flip { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); }
    .print--flip svg { grid-column: 2; }
    .print--flip .tags {
      grid-column: 1;
      justify-self: end;
      justify-content: flex-end;
      text-align: right;
    }

    .print p {
      grid-column: 2;
      grid-row: 2;
      margin-top: 1rem;
      max-width: 32ch;
      font-size: clamp(1.15rem, 1.7vw, 1.35rem);
      line-height: 1.7;
      color: var(--ink-soft);
    }

    /* 찍혀 나오는 등장 */
    .stamp { animation: stamp 1.1s var(--ease-out) both; }
    .stamp-2 { animation-delay: 0.15s; }
    @keyframes stamp {
      from { opacity: 0; transform: scale(1.035); filter: blur(3px); }
    }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .poster-wrap { max-width: 420px; }
      .print { grid-template-columns: 1fr; grid-template-rows: auto; }
      .print svg { grid-row: auto; max-width: 340px; }
      .print h3 { grid-column: 1; grid-row: auto; margin-top: 1.5rem; }
      .print p { grid-column: 1; grid-row: auto; }
      .tags { grid-column: 1; grid-row: auto; margin-top: 1.5rem; }
      .print--flip { grid-template-columns: 1fr; }
      .print--flip svg { grid-column: 1; }
      .print--flip .tags { grid-column: 1; grid-row: auto; justify-self: start; justify-content: flex-start; text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .stamp { animation: none; }
      .print svg, .poster { transition: none; }
    }
  </style>
</head>

  <script>
    // 여기만 고치면 내 정보가 바뀌어요
    const ME = {
      name: "라이언",
      intro: "Seoul\nMarch 15\nWeb design trainer\nFL studio learner",
      intro2: "Videogames\nPianist\nListener",
      birthday: "3월 15일생",
      sign: "물고기자리",
      hobbies: [
        { tags: ["House", "Lo-fi", "Background music", "Game original soundtrack", "EDM", "Impressionism", "Film scores"] },
        { tags: ["Illustrator", "Photoshop", "InDesign", "Abstract art", "Infographic", "Metro line map", "Character design", "Midjourney"] },
        { title: "달리기 운동", desc: "바람을 가르며 달리면 기분이 상쾌해요." },
      ],
    };

    document.querySelectorAll("[data-me]").forEach((el) => { el.textContent = ME[el.dataset.me]; });
    document.querySelectorAll(".print").forEach((el, i) => {
      const hobby = ME.hobbies[i];
      if (hobby.tags) {
        const list = el.querySelector(".tags");
        hobby.tags.forEach((tag) => {
          const li = document.createElement("li");
          li.textContent = tag;
          list.appendChild(li);
        });
        return;
      }
      el.querySelector("h3").textContent = hobby.title;
      el.querySelector("p").textContent = hobby.desc;
    });

    // 음악 판화: 소용돌이 선율을 그려요
    const NS = "http://www.w3.org/2000/svg";
    function spiral(cx, cy, r, turns, dir) {
      const steps = Math.round(turns * 60);
      let d = "";
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = dir * t * turns * Math.PI * 2;
        const rr = r * (1 - t * 0.92);
        d += (i ? " L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + " " + (cy + Math.sin(a) * rr).toFixed(1);
      }
      return d;
    }
    const swirls = [
      [108, 196, 46, 2.3, 1],
      [196, 140, 40, 2.1, -1],
      [116, 82, 30, 2, 1],
      [212, 54, 18, 1.8, -1],
    ];
    const stem = "M150 242 C122 236 96 250 70 214 M150 242 C176 224 230 196 232 150 M150 242 C150 180 82 150 90 104";
    const group = document.querySelector('[data-spirals="music"]');
    [["#1f1a17", 13, "translate(3 4)"], ["#f2e4c4", 9, ""]].forEach(([color, width, transform]) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", swirls.map((s) => spiral(...s)).join(" ") + " " + stem);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", width);
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      if (transform) p.setAttribute("transform", transform);
      group.appendChild(p);
    });

    // 맨 아래 오른쪽 날짜: 새로고침할 때마다 오늘 날짜로 바뀌어요 (예: Oct 7, 2026)
    const today = new Date();
    const todayEl = document.getElementById("today");
    todayEl.textContent = today.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    todayEl.dateTime = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, "0"), String(today.getDate()).padStart(2, "0")].join("-");

    // 고양이 판화에 마우스를 올리고 있는 동안만 눈을 깜빡여요
    const poster = document.getElementById("poster");
    const eyes = document.getElementById("eyes");
    let blinkTimer = null;

    function blinkOnce() {
      eyes.classList.add("blink");
      setTimeout(() => eyes.classList.remove("blink"), 160);
    }

    function keepBlinking() {
      blinkTimer = setTimeout(() => {
        blinkOnce();
        keepBlinking();
      }, 1200 + Math.random() * 1000);
    }

    poster.addEventListener("pointerenter", () => {
      blinkOnce();
      keepBlinking();
    });

    poster.addEventListener("pointerleave", () => {
      clearTimeout(blinkTimer);
      blinkTimer = null;
    });
  </script>
</body>
</html>
